[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fallacy-scanner"
version = "0.1.0"
description = "Semantic heuristics engine identifying logical fallacies (circular reasoning, hasty generalization, false dilemma) in agent reasoning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-fallacy-scanner = "agent_fallacy_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_fallacy_scanner*"]
